[project]
name = "macos-cleanup"
version = "0.1.0"
description = "Conservative cleanup of user cache and log files on macOS"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
macos-cleanup = "macos_cleanup.cleaner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macos_cleanup"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
